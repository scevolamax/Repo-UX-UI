<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería Flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Nuestra seleccion de relojes - era sovietica</h1>
    
    <!-- Contenedor de la galería -->
    <div class="galeria-contenedor">

        <div class="tarjeta-producto">
            <img src="https://www.amchpr.com/uploads/5/7/6/1/57616385/20_jewel_shuangling_beijing_wf_wrist.jpg" alt="Producto 1">
            <h3>Reloj 1 a cuerda</h3>
            <p class="precio">$45.000</p>
            <button>Comprar</button>
        </div>

        <!-- Tarjeta 2 -->
        <div class="tarjeta-producto">
            <img src="https://www.amchpr.com/uploads/5/7/6/1/57616385/shanghai_7120_813_spiral_dial.jpg" alt="Producto 2">
            <h3>Reloj 2 a cuerda</h3>
            <p class="precio">$60.000</p>
            <button>Comprar</button>
        </div>

        <!-- Tarjeta 3 -->
        <div class="tarjeta-producto">
            <img src="https://www.amchpr.com/uploads/5/7/6/1/57616385/shanghai_sb1h_dodecagon_goldtone.jpg" alt="Producto 3">
            <h3>Reloj 3 a cuerda</h3>
            <p class="precio">$25.000</p>
            <button>Comprar</button>
        </div>

        <!-- Tarjeta 4 -->
        <div class="tarjeta-producto">
            <img src="https://www.amchpr.com/uploads/5/7/6/1/57616385/beifang_dial_harbin_watch_factory_zhe.jpg" alt="Producto 4">

        </div>

        <!-- Tarjeta 5 -->
        <div class="tarjeta-producto">

            <h3>Reloj 5 a cuerda</h3>
            <p class="precio">$210.000</p>
            <button>Comprar</button>
        </div>

        <!-- Tarjeta 6 -->
        <div class="tarjeta-producto">
            <img src="https://www.amchpr.com/uploads/5/7/6/1/57616385/hongqi_laioning_brand_sl2_1970s_dial_a.jpg" alt="Producto 6">
            <h3>Reloj 6 a cuerda</h3>
            <p class="precio">$15.000</p>
            <button>Comprar</button>
        </div>

    </div>
